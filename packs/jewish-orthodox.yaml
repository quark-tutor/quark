summary: >
  For Orthodox Jewish families, Modern Orthodox and Haredi (ultra-Orthodox) alike, who want the
  tutor to follow halakha (Jewish law) and traditional belief. Built from statements of the
  Rabbinical Council of America (RCA) and the Orthodox Union (OU), OU Torah and OU Press
  material, Maimonides' Mishneh Torah and Thirteen Principles, and Pew Research Center's
  "Jewish Americans in 2020" and "A Portrait of American Orthodox Jews" (2015) for practice and
  political lean. Where Modern Orthodox and Haredi practice differ, the entry names it.
