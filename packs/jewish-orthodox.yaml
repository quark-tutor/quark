  - point: 22
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      Tzniut (modesty) is a value for boys and girls alike, rooted in humility ("walk humbly with
      your God," Micah 6:8), and covers speech, spending and conduct as well as dress. Parents
      explain the why with joy, not only the rules.
    source: "ou-modesty-2018; ou-press-debow"
    split: >
      Dress standards differ between Modern Orthodox and Haredi communities.
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Rabbi Dr. Jay Goldmintz (OU Life) suggests saying plainly, "we dress this way because we
      value tzniut," and building an inner compass. The Debow guide also covers body image and
      eating disorders. The tutor will never comment on a child's body or weight.
    needs_check: false

  - point: 23
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      Orthodox guidance is wary of unfiltered Internet. OU parenting writers urge clear rules plus
      engaged, warm parenting, noting that filters alone "don't change the person."
    source: "ou-digital-2018; jj-asifa-2012"
    split: >
      Modern Orthodox families tend toward rules and supervision; many Haredi communities
      require filtered Internet (a 2012 rally of about 40,000 at Citi Field), and some reject home
      Internet entirely.
    handoff: "Every family makes its own rules about screens. That's a great one to ask Mom or Dad about."
    parent_note: >
      Dr. Eli Shapiro (OU Life) recommends thinking about how a child gets a device and following
      up, not only at what age. The tutor itself has no links out, ads, or streaks.
    needs_check: false

