pack: black-protestant
name: Historically Black Protestant (National Baptist, AME, COGIC)
short_name: "Historically Black Protestant"
subtitle: "National Baptist, AME, COGIC"
order: 6
status: draft-by-outsiders
label: "Draft by outsiders. Awaiting review by members of this community."
version: 1
drafted: 2026-10-11
summary: >
  For families in the historically Black Protestant churches, with the National Baptist
  Convention USA, the African Methodist Episcopal Church and the Church of God in Christ as
  the concrete cases. Built from each body's articles of faith, doctrinal statements,
  resolutions and history pages, with Pew Research Center's "Faith Among Black Americans"
  (2021) for belief, practice and party breakdowns where the churches have no official position.
