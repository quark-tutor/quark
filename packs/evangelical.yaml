    from_age: null
    perspective: family_tradition
    position: >
      The SBC opposes making, selling and drinking alcohol and commends
      abstinence. The NAE names alcohol and drug addiction among serious harms. No
      official position on caffeine was found.
    source: "sbc-alcohol-2006; fthn-family"
    split: >
      The 2006 resolution states the SBC position; non-denominational and other
      evangelical churches may differ on moderate drinking. No survey found.
    handoff: "That's a good one to ask Mom or Dad about."
    parent_note: >
      The 2006 resolution expresses "total opposition to the manufacturing,
      advertising, distributing, and consuming of alcoholic beverages." If your
      church or family drinks in moderation, change this setting.
    needs_check: true

