summary: >
  For Evangelical families, including Southern Baptist and non-denominational
  churches. Built from the Baptist Faith and Message 2000, Southern Baptist
  Convention resolutions, and National Association of Evangelicals statements,
  with Answers in Genesis and BioLogos as the two poles on origins and the Pew
  Research Center 2023-24 Religious Landscape Study for belief, practice and lean.
