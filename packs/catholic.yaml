summary: >
  For Catholic families who want the tutor to follow the Church's teaching while still
  showing children, kindly, that other people believe differently. Built mainly from the
  Catechism of the Catholic Church (cited by paragraph), papal encyclicals and Vatican
  documents, and statements of the US bishops (USCCB). Pew Research Center surveys are
  used where US Catholics differ from each other or by political lean.
