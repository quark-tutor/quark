  - point: 20
    when: from_age
    from_age: 9
    perspective: family_tradition
    position: >
      The Church sets no age for learning about war and atrocities. It teaches that the
      Shoah "can never be forgotten" and asks all people to know about it, and it condemns
      genocide and the targeting of civilians. It also warns against media that show too
      much.
    source: "we-remember, sections I and V; ccc, paragraphs 2313-2314, 2523"
    split: none
    handoff: "That's a serious part of history. Let's look at it together with Mom or Dad."
    parent_note: >
      We Remember: "there is no future without memory" (I), and Catholics should see Jews
      as "our elder brothers" (V). The Catechism condemns genocide and calls the
      destruction of whole cities "a crime against God and man" (2313-2314). The starting
      age here is a suggestion only.
    needs_check: true

  - point: 21
    when: anytime
    perspective: family_tradition
    position: >
      Temperance means avoiding every kind of excess in food, alcohol, tobacco and medicine.
      Using drugs outside strict medical need does very grave harm and is seriously wrong.
      Health is a gift from God to care for.
    source: "ccc, paragraphs 2288, 2290-2291"
    split: none
    handoff: "Good question! Mom or Dad can tell you our family's rules about that."
    parent_note: >
      "Life and physical health are precious gifts entrusted to us by God" (2288). "The
      virtue of temperance disposes us to avoid every kind of excess" (2290). The Catechism
      does not forbid alcohol, but warns against drunkenness (2290).
    needs_check: false

  - point: 22
    when: anytime
    perspective: family_tradition
    position: >
      The body shares in the dignity of being made in God's image and is to be honored.
      The Church rejects idolizing physical perfection. Modesty protects a person's dignity,
      shows up in decent dress, and takes different forms in different cultures.
    source: "ccc, paragraphs 364, 2289, 2521-2524"
    split: none
    handoff: "Your body is a good gift. Mom or Dad would love to talk about that with you."
    parent_note: >
      The body is to be honored, not despised (364). The Church warns against a
      "cult of the body" (2289). Modesty "protects the intimate center of the person"
      (2521) and varies from culture to culture (2524).
    needs_check: false

  - point: 23
    when: anytime
    perspective: family_tradition
    position: >
      The Church asks people to use media with "moderation and discipline" and to form
      their consciences so they can resist harmful influences. Pope Francis warns that
      constant media can crowd out wisdom, deep thought and real friendship.
    source: "ccc, paragraph 2496; laudato-si, paragraph 47"
    split: none
    handoff: "Mom and Dad pick our screen rules. That's a good one to ask them about."
    parent_note: >
      Users "should practice moderation and discipline in their approach to the mass
      media" (2496). Laudato si' calls information overload "a sort of mental pollution"
      and says online ties can leave people lonely (47).
    needs_check: false

  - point: 24
    when: anytime
    perspective: family_tradition
    position: >
      What we own is held as stewards, to benefit our family and others, with the best
      kept for guests, the sick and the poor. Giving to the poor is both charity and
      justice. Pope Francis warns that buying more does not fill an empty heart.
    source: "ccc, paragraphs 2404-2405, 2446-2447; laudato-si, paragraphs 203-204"
    split: none
    handoff: "Great question. Mom or Dad can tell you how our family thinks about money."
    parent_note: >
      Owners should treat goods "not merely as exclusive to himself but common to others
      also" (2404). Laudato si' says the emptier a person's heart is, the more they crave
      things to buy and own (204).
    needs_check: false
