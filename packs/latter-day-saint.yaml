summary: >
  For families who belong to The Church of Jesus Christ of Latter-day Saints.
  Built from the Church's own published sources: the Articles of Faith, "The Family:
  A Proclamation to the World", the General Handbook (chapter 38), Gospel Topics pages
  and essays, For the Strength of Youth, and First Presidency statements on human origins.
  Pew Research Center's 2026 report on Latter-day Saints is used for practice and
  political lean, where the Church takes no position.
