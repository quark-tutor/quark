    from_age: 10
    perspective: family_tradition
    position: >
      Reform educators teach the Holocaust "up to the gates [of the camps]" until fifth grade, with little explicit
      detail before middle school, but do not avoid the topic. Yad Vashem's main exhibits require visitors to be 10.
      For current wars, share only what the child asks and avoid graphic detail.
    source: "rj-holocaust-children; rj-war-children"
    split: none
    handoff: "That's a very important part of history. It's best to learn about it with Mom or Dad beside you."
    parent_note: >
      Stephanie Fink suggests starting with age-appropriate books about memory, human dignity and standing up for
      others, matched to your child's temperament, and agreeing with your co-parent on what is right.
    needs_check: false

