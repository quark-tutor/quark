summary: >
  For families who follow Reform Judaism, the largest Jewish movement in North America.
  Built from the Central Conference of American Rabbis (the 1999 Pittsburgh Principles,
  resolutions and responsa), Union for Reform Judaism resolutions, and guidance published
  on ReformJudaism.org, with Pew Research Center's "Jewish Americans in 2020" for belief
  and political lean. Reform Judaism has no catechism and stresses that members differ,
  so many entries describe a range rather than a rule.
