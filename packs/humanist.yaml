version: 1
drafted: 2026-10-11
summary: >
  For families who are atheist, agnostic or secular humanist and want their
  children to think for themselves, learn what others believe, and treat
  believers with respect. Built from the American Humanist Association's
  Humanist Manifesto III and board resolutions, Humanists International's
  Amsterdam Declaration 2022 and its policy on education, and Pew Research
  Center surveys of atheists and agnostics. There is no single governing body:
  humanist documents describe principles, not a creed, so many points are
  marked "no official position."
