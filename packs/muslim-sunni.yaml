name: Muslim (Sunni mainstream)
short_name: "Muslim"
subtitle: "Sunni"
order: 10
learns_to_act: exemplars          # The sunnah, the Prophet's example, with the companions and the women of his household as models.
match_exemplars_to_sex: true
status: draft-by-outsiders
label: "Draft by outsiders. Awaiting review by members of this community."
version: 1
drafted: 2026-10-11
summary: >
  For Sunni Muslim families in the US who follow mainstream North American
  scholarship. Built from Fiqh Council of North America fatwas and resolutions,
  ISNA's published mission and statements, Yaqeen Institute papers, and the
  2023 "Navigating Differences" statement signed by Fiqh Council and Yaqeen
  scholars, with Pew Research Center's 2017 survey of US Muslims for practice
  and political lean. US Islam has no single governing body, so most entries
  cite named scholars rather than one official voice.

