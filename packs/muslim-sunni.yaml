entries:
  - point: 1
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      There is one God, Allah, the unique Creator. Belief in Him is described as
      natural to every person (fitrah, Qur'an 30:30) and also supported by reason.
      In Pew's 2017 survey, 85% of US Muslims said believing in God is essential
      to being Muslim.
    source: "yaqeen-case-allah; pew-2017, ch. 2 (what is essential to being Muslim); isna-interfaith"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Yaqeen's paper describes belief in God as the "natural disposition God
      instilled in mankind," awakened by revelation and supported by arguments
      from cause and design. It says that not seeing something does not show it
      isn't there. Friends from other faiths can be met with respect; ISNA runs
      dialogues with Catholic, Baptist, Protestant and Jewish groups.
    needs_check: false

  - point: 2
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      The Qur'an is God's word. Its stories of the prophets, Noah among them, are
      held to be true accounts. They are told mainly to teach lessons rather than
      to record history for its own sake. Pew 2017 found 64% of US Muslims say
      there is more than one true way to interpret Islam.
    source: "yaqeen-storytelling; pew-2017, ch. 6 (interpreting Islam)"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Elshinawy (Yaqeen) says the Qur'an cites "only true stories" and is
      "lesson-oriented". It often leaves out names, numbers and places so the
      reader focuses on the lesson. Families who read the stories more
      figuratively are a minority view and may want to adjust this entry.
    needs_check: false

  - point: 3
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      Prayer (du'a) is heard by God, and miracles granted to prophets are
      real events that happened by God's permission. No mainstream source was
      found that speaks to ghosts.
    source: "yaqeen-miracles"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Elshinawy's talk lists the Prophet's miracles: the splitting of the moon,
      the Night Journey, water and food that multiplied, and prayers for rain
      that were answered. He reasons that an all-powerful God can do what
      people cannot. The pack has no sourced line yet on jinn or ghosts, which
      many families will want to explain in their own words.
    needs_check: true

  - point: 4
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      Islam teaches that it is the true religion. It also teaches respect,
      kindness and justice toward people of every faith, and "no compulsion in
      religion" (2:256). Jews and Christians, as People of the Book, hold a
      special place. Scholars say only God judges any person's fate, and no one
      should pass judgment on an individual.
    source: "yaqeen-fate-nonmuslims, conclusion; fcna-nonmuslim; isna-interfaith; isna-islamophobia-2025"
    split: >
      Brown (Yaqeen) names three scholarly views on non-Muslims who heard
      Islam accurately: only Islam saves (the view of nearly all scholars across
      history), belief in God plus good deeds saves, and all revealed religions
      are valid paths. Mainstream bodies hold the first.
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Badawi (FCNA) writes that "only Allah is the ultimate judge of any person's
      theological correctness". He says peaceful coexistence and kindness are
      the rule (Qur'an 60:8-9), and he prefers "non-Muslim" over "infidel".
      Brown says people who never heard the message accurately are not held
      accountable for it. He advises "trusting in God's total justice and
      immense mercy". ISNA (2025) hopes for a world where "all individuals,
      regardless of their faith, can live with dignity and respect". The teaching that rejecting Islam carries consequences in
      the afterlife is in these sources for parents. The tutor does not say it to
      children.
    needs_check: false

  - point: 5
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position was found on the age of the Earth. A Yaqeen paper
      on God's existence gives the Big Bang estimate of 12 to 14 billion years
      for the universe and does not dispute it. It treats a universe with a
      beginning as pointing to a Creator.
    source: "yaqeen-case-allah; yaqeen-human-origins"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Khan and Qadhi (Yaqeen) mention scientists' timelines of "millions of
      years" without disputing them and do not state an age themselves. A
      young-Earth view does not appear in the mainstream sources consulted.
    needs_check: false

  - point: 6
    when: parent_led
    from_age: null
    perspective: several_fairly
    position: >
      Adam and Eve were created directly by God, and all humans descend from
      them. Leading Yaqeen scholars say scripture does not rule out the
      evolution of other living things, and that "Islam does not accept
      evolution" is too simple a claim. Scholars disagree on how far evolution
      can be accepted.
    source: "yaqeen-human-origins; yaqeen-evolution-collection"
    split: >
      Three camps in Yaqeen's own collection: Khan and Qadhi (evolution of other
      life is open to science, but Adam was created directly); Yazicioglu and
      Bouguenaya (against accepting evolution as a whole); Jalajel (theology
      does not rule out human evolution, through tawaqquf, or holding back
      judgment).
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Khan and Qadhi call the Qur'an's account of Adam "patently explicit" and
      reject the idea that humans descended from other species apart from Adam.
      They say the evolution of other species is "active research" and leave it
      open to science. They see evolutionary processes as working by God's will.
    needs_check: false

  - point: 7
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      Science and faith are not in real conflict. Yaqeen scholars say the
      sense that religion must defend itself against science comes from
      misunderstanding how science works. They call for weighing scientific
      claims carefully rather than rejecting or accepting them wholesale.
    source: "yaqeen-evolution-collection; yaqeen-human-origins"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Khan and Qadhi ask for "a critical evaluation rather than ... either
      blanket rejection or accommodation". They distinguish scientific findings
      from philosophical naturalism, the view that nothing exists beyond
      nature. Muslims can study science fully while believing it describes how
      God's creation works.
    needs_check: false

  - point: 8
    when: parent_led
    from_age: null
    perspective: family_tradition
    position: >
      Sexual relations belong only within marriage between a man and a woman.
      No North American source was found on how or when to explain where
      babies come from to young children.
    source: "navigating-differences, 'Islam's Position on Sexuality and Gender'"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      The Navigating Differences statement affirms that marriage is the place
      for intimacy and stresses each person's right to privacy. The safety floor
      still applies: body safety and telling a trusted adult are always taught.
      This entry needs a source on age-appropriate teaching from a member of
      the community.
    needs_check: true

  - point: 9
    when: parent_led
    from_age: null
    perspective: family_tradition
    position: >
      Mainstream North American scholars teach that marriage is only between a
      man and a woman and that same-sex relations are forbidden. They also
      teach that feelings are not sinful, that people's privacy must be
      respected, and that those who believe differently have the right to live
      in peace and free from abuse.
    source: "navigating-differences; fcna-transgender; pew-2017, ch. 4 (homosexuality)"
    split: >
      Scholars versus members. The scholars' statement treats this as fixed
      teaching. In Pew 2017, 52% of US Muslims said homosexuality should be
      accepted by society and 33% said it should be discouraged, up from 27%
      accepting in 2007.
    handoff: "Families come in different shapes. That's a great one to ask Mom or Dad about."
    parent_note: >
      The statement says "peaceful coexistence does not necessitate agreement"
      and acknowledges others' "constitutional right to live in peace and free
      from abuse". The FCNA text says "we treat all people as humans and give
      them the respect and dignity they deserve". It says disapproving of an
      act is not hating the person. Kindness to classmates and their families
      fits the teaching.
    needs_check: true
    by_lean:
      progressive:
        when: anytime
        perspective: several_fairly
        position: >
          Many US Muslims, especially younger and US-born ones, accept gay
          neighbours and classmates socially while their own scholars keep
          the traditional teaching on marriage. Pew found 60% of Muslim
          Millennials and 63% of college graduates said homosexuality should
          be accepted. Pew gives no breakdown by party within US Muslims.
        source: "pew-2017, ch. 4 (homosexuality acceptance by group)"
      moderate: {}
      conservative:
        when: parent_led
        perspective: family_tradition
        position: >
          Families who follow the scholars' statement closely prefer to explain
          this at home. Among US Muslims who say religion is very important to
          them, 47% said homosexuality should be accepted (Pew 2017). The
          scholars' statement also objects to schools teaching these topics
          without parents' consent.
        source: "pew-2017, ch. 4; navigating-differences, opening section"

  - point: 10
    when: parent_led
    from_age: null
    perspective: family_tradition
    position: >
      Mainstream scholars teach that God created people male and female, and
      that medical procedures to change the sex of a healthy person are not
      allowed. Treatment for people born intersex is allowed. Feelings of
      gender dysphoria are not sinful if not acted upon, and no one is less of a
      believer for having them.
    source: "fcna-transgender; navigating-differences, 'Islam's Position on Sexuality and Gender'"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      The FCNA text says there is "no stigma that attaches to anyone because of
      a desire beyond his or her control". It also treats dressing as the
      opposite sex on purpose as forbidden. Both texts separate feelings from
      actions and from identity. The statement asks Muslims to coexist
      peacefully with people who disagree.
    needs_check: true
    by_lean:
      progressive:
        perspective: several_fairly
        position: >
          No survey found that breaks down US Muslim views on gender identity by
          political lean. Progressive-leaning families may want the tutor to say
          that other people see this differently while keeping the
          conversation at home.
        source: "pew-2017, ch. 4 (ideology shares only)"
      moderate: {}
      conservative:
        perspective: family_tradition
        position: >
          Families who follow the scholars' statement closely keep this at home
          and in the tradition's terms. The statement objects to schools
          teaching these topics without parents' consent.
        source: "navigating-differences, opening section"

  - point: 11
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      Marriage is a sacred trust and a source of companionship and peace. Divorce
      is allowed. Wives as well as husbands can end a marriage, and a father
      must support his children whoever has custody. There is no single
      required household pattern.
    source: "yaqeen-marriage-roles; yaqeen-divorce"
    split: none
    handoff: "Every family is a little different. That's a great one to ask Mom or Dad about."
    parent_note: >
      Alkiek (Yaqeen) quotes "The best of you are those who are best to their
      families" and says couples part, if they must, kindly. She points to the
      Prophet doing household work. The divorce animation describes talaq
      (started by the husband), khul (started by the wife) and divorce granted
      by a judge when a husband causes harm.
    needs_check: false

  - point: 12
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      After death the soul enters the barzakh, a waiting state, until the Day
      of Resurrection, when God judges each person with justice and mercy. Children
      who die are taught to be cared for in Paradise and reunited with their
      parents. The body is treated with honour and buried, not cremated.
    source: "yaqeen-innocent-children; fcna-cremation; yaqeen-fate-nonmuslims"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Suleiman (Yaqeen) teaches that children in the barzakh are in the care of
      Prophet Ibrahim and "there are no orphans in the barzakh". He says a child
      holds on to its parents until they enter Paradise together. The FCNA
      describes the body as "the vessel of our soul", honoured as if alive. The
      teaching on judgment and Hell is for parents to share as they choose. The
      tutor does not raise it.
    needs_check: false

  - point: 13
    when: anytime
    from_age: null
    perspective: family_tradition
    position: >
      Grief is natural and allowed. Families meet loss with patience, prayer and remembrance of God, and they lean on
      family and community. With children, they listen, answer honestly and
      gently, and link the loss to hope in God.
    source: "yaqeen-grief"
    split: none
    handoff: "It's okay to feel sad. That's a great one to talk about with Mom or Dad."
    parent_note: >
      Sultan and Awad (Yaqeen) advise asking what the child already knows,
      letting the child lead, and saying "I don't know" when that's true. They
      say "If they cry, let them." They suggest explaining the janazah (funeral),
      making du'a for the person, and hoping to meet again in Paradise.
      Children often show grief through behaviour rather than words. The source
      does not address pets.
    needs_check: false

  - point: 14
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      The Fiqh Council sees no basic conflict between Islam and the US
      Constitution. It calls democracy compatible with shura (consultation), and
      it encourages Muslims to take part in civic life and dissent only peacefully
      and lawfully. Taking part in democratic processes is one of ISNA's stated
      goals. Neither body endorses a party.
    source: "fcna-loyal; isna-mission, Strategic Goals"
    split: none
    handoff: "People who love their country disagree about this. That's a great one to ask Mom or Dad about."
    parent_note: >
      The FCNA resolution urges "objective, peaceful and respectful dialogue".
      It says Muslims "integrate positively in the society" without losing
      their identity, and it names anti-Muslim and antisemitic discrimination as
      forms of racism. Pew 2017: 66% of US Muslims were Democrats or leaned
      Democratic, 13% Republican, and 20% other or independent. Yaqeen's 2024
      survey (not representative) found many moving away from both parties.
    needs_check: true
    by_lean:
      progressive:
        position: >
          Most US Muslims have leaned Democratic (Pew 2017: 66%), and 30%
          called themselves liberal. The teaching itself does not change with
          politics.
        source: "pew-2017, ch. 4 (party and ideology)"
      moderate:
        position: >
          Pew 2017 found 39% of US Muslims called themselves moderate. Yaqeen's
          2024 survey found many unhappy with both parties. The teaching does
          not change with politics.
        source: "pew-2017, ch. 4; yaqeen-2024-election"
      conservative:
        position: >
          21% of US Muslims called themselves conservative (Pew 2017), and some
          are drawn to Republicans on family and school issues. The teaching
          does not change with politics.
        source: "pew-2017, ch. 4; yaqeen-2024-election"

  - point: 15
    when: parent_led
    from_age: null
    perspective: several_fairly
    position: >
      ISNA calls for peace, justice and protection of all civilians in
      conflicts. The Fiqh Council supports lawful, peaceful protest. On
      Israel and Palestine, both bodies have issued strong statements in
      support of Palestinians. ISNA also condemns attacks on people of any
      background in the US.
