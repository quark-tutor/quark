    position: >
      Alcohol and anything that intoxicates is forbidden ("every intoxicant is
      khamr and every khamr is haram"). That includes recreational marijuana,
      though some non-intoxicating medical uses are allowed. Vaping and smoking
      are discouraged as harmful. No ruling on caffeine was found.
    source: "fcna-marijuana; yaqeen-drugs-alcohol"
    split: none
    handoff: "That's a great one to ask Mom or Dad about."
    parent_note: >
      Khokhar (Yaqeen) advises a warm but firm relationship and starting
      conversations early, since vaping can begin around age 8. He says "just
      say no does not work" and suggests talking through pros and cons, often
      side by side, as in the car. His summary is "population level prohibition,
      but individual level compassion." He adds that a substance being legal
      does not change its religious ruling.
    needs_check: false

