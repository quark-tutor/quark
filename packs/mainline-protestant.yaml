summary: >
  For families in the four largest mainline Protestant churches: the United Methodist
  Church, the Episcopal Church, the Evangelical Lutheran Church in America (ELCA) and the
  Presbyterian Church (U.S.A.). Built from the UMC Social Principles (2024) and Book of
  Discipline, Episcopal General Convention resolutions and Prayer Book catechism, ELCA social
  statements and policy statements, and the PCUSA Book of Order and General Assembly actions,
  with Pew Research Center surveys for what members believe and how they lean politically.
