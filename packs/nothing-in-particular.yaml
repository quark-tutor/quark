summary: >
  For families who, when asked their religion, say "nothing in particular": most believe in God
  or some higher power, rarely attend services, and want their kids taught decency without
  doctrine. This group has no official body, so every position here is survey-based, mainly from
  Pew Research Center's 2023-24 Religious Landscape Study and its 2024 report on religious "nones",
  with Pew, Gallup and YouGov data on parents and on party differences where those exist.
