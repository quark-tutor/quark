entries:
  - point: 1
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). Most in this group believe in God or a universal spirit
      (70%), but most of those are not absolutely certain (44% not certain, 26% certain); 29% do not
      believe. Religion is very important to 7%, and 85% seldom or never attend services.
    source: "pew-rls-nip, Belief in God / Importance of religion / Attendance; pew-rls-beliefs, belief in God or a universal spirit (69%); pew-nones-2024-ch4, belief in God or a higher power (83%); pew-nones-2024-ch8, moral without God (83%); pew-rls-switching, raised in a religion"
    split: "Believers in God or a higher power, mostly unsure of the details (about 7 in 10) and non-believers (about 3 in 10)."
    handoff: "People believe lots of different things about God. That's a great one to talk about with Mom or Dad."
    parent_note: >
      Pew's figures describe belief without a set doctrine: most in this group believe in some God
      or higher power (83% in Pew's 2023 nones survey), many grew up in a religion (20% of all U.S.
      adults were raised in one and are now unaffiliated), and 82-83% say a person can be moral without
      believing in God. A plain answer: "Lots of people believe in God, and people picture God in
      different ways. Some people don't believe. Here's what I think..."
    needs_check: false

  - point: 2
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position; no survey found on how this group reads scripture stories as history or
      story. The nearest data: 10% of the religiously unaffiliated say the Bible is very or extremely
      important in their lives, and Pew says that share comes almost entirely from "nothing in
      particular" adults.
    source: "pew-rls-bible, Importance of the Bible; pew-rls-nip, Importance of religion; pew-rls-child-rearing, parents' religious activities with children"
    split: "Unknown; no survey splits this group on scripture as history versus story."
    handoff: "Some people read that story as history and some read it as a teaching story. Ask Mom or Dad what they think!"
    parent_note: >
      No survey tells us how families like yours read Bible stories; Pew finds just 9% of
      unaffiliated parents send their child to a religious education program. A neutral approach is to
      share the story, say that some people believe it happened just as told and others read it as a
      story with a lesson, and add what scientists or historians have found where that applies.
    needs_check: true

  - point: 3
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). Most in this group believe humans have a soul or spirit
      (79%) and that there is something spiritual beyond the natural world (about two-thirds). Prayer is
      occasional: 17% pray daily, 21% weekly or monthly, 61% seldom or never.
    source: "pew-rls-beliefs, souls and something spiritual beyond the natural world; pew-rls-nip, Prayer; pew-nones-2024-ch5, spiritual experiences"
    split: "Spiritual believers (most) and skeptics (a sizeable minority)."
    handoff: "People have lots of different ideas about prayer and spirits. That's a fun one to talk over with Mom or Dad."
    parent_note: >
      Pew finds most of this group describe themselves as spiritual, and among all "nones" 54%
      sometimes do things to connect with something bigger than themselves. You can say: "Some people
      pray and feel it helps. Some don't. Scientists study what we can measure; lots of people believe
      there's more than that."
    needs_check: false

  - point: 4
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position; no survey found on whether this group sees other religions as true or
      mistaken. The nearest data: 62% of agnostics and "nothing in particular" adults agree religion
      helps society by giving people meaning and purpose, while most "nones" also say religion can
      cause division.
    source: "pew-nones-2024-ch6, meaning and purpose (62%); pew-teaching-children-2014, religiously unaffiliated and tolerance"
    split: none
    handoff: "People from different religions believe different things about that. It's a good one to ask Mom or Dad."
    parent_note: >
      This group has no religion of its own to rank others against. Pew's 2014 study found the
      religiously unaffiliated were more likely than the affiliated to rank tolerance among the most
      important things to teach children. A fitting answer: "Your friend's family believes different
      things than we do, and that's okay. We can be curious about what they believe."
    needs_check: true

  - point: 5
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position; no survey found on this group's view of the age of the Earth. The nearest
      data is on human origins: 53% say humans evolved with no role for God, 29% evolved with God
      guiding or allowing it, and 16% say humans have existed in their present form since the beginning.
    source: "pew-rls-nip, Evolution"
    split: "Most accept the scientific account; about 1 in 6 hold that humans have always existed in their present form."
    handoff: "Scientists say the Earth is about 4.5 billion years old. Some families believe something different, so ask Mom or Dad what they think too."
    parent_note: >
      Most families in this group accept the scientific timeline, so the tutor states the science
      (about 4.5 billion years) and mentions that some people believe differently. No survey asks
      this group about the Earth's age directly, so check this fits your family.
    needs_check: true

  - point: 6
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). 82% say humans evolved over time: 53% through natural
      selection with no role for God, 29% with God guiding or allowing it. 16% say humans have existed
      in their present form since the beginning of time.
    source: "pew-rls-nip, Evolution"
    split: "Evolution without God (about half), evolution guided or allowed by God (about 3 in 10), humans unchanged since the beginning (about 1 in 6)."
    handoff: "Scientists have learned a lot about how living things change over time. Some people also believe God had a part in it. Ask Mom or Dad what they think!"
    parent_note: >
      Answer to "Did people come from monkeys?": "Not from monkeys that are alive today. Scientists
      found that people and apes share ancestors from long, long ago." Many in this group also believe
      God had a hand in it; both views are common here.
    needs_check: false

  - point: 7
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). 64% of this group say religion and science are mostly in
      conflict, yet about 7 in 10 believe in God or a universal spirit, and 31% say science can explain
      everything. Most hold both science and some faith at once.
    source: "pew-rls-science, conflict (64%); pew-rls-beliefs, belief in God (69%); pew-nones-2024-ch7, science can explain everything (31%)"
    split: "Those who see faith and science as conflicting (most) and those who see them as compatible."
    handoff: "Lots of people believe in God and love dinosaurs and science too. What do you think? Ask Mom or Dad what they believe."
    parent_note: >
      Your group is split on this in an unusual way: most say science and religion clash, but most
      also believe in God. A good answer for a child: "Yes, lots of people believe in God and also
      know dinosaurs lived millions of years ago. Some people see a clash, and some don't."
    needs_check: false

  - point: 8
    when: parent_led
    from_age: null
    perspective: omitted
    position: >
      No official position; no survey found on how this group teaches young children where babies
      come from.
    source: "pew-parenting-2023, no question on this topic"
    split: "Unknown."
    handoff: "That's a really good question for Mom or Dad. They'd love to talk about it with you."
    parent_note: >
      No survey covers this. Parent-led is a cautious default for a 6-to-12 range; many families answer
      simply ("A baby grows in a special place inside the mother called the uterus") and add detail as
      kids grow. Body-part names and body safety stay on the safety floor and are always taught.
    needs_check: true

  - point: 9
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). 84% of this group favor same-sex marriage and 82% say
      homosexuality should be accepted; 15% oppose same-sex marriage.
    source: "pew-rls-nip, Same-sex marriage / Homosexuality"
    split: "Strong majority accepting (over 8 in 10); minority opposed (about 1 in 6)."
    handoff: "Families come in lots of shapes. If you want to know more, Mom or Dad would love to talk about it."
    parent_note: >
      Most families in this group would simply say: "Sam has two dads who love him. Some families have
      a mom and a dad, some have two moms or two dads, some have one parent." Pew has no figures
      for this group by party, so the lean variants below rely on national party data.
    needs_check: true
    by_lean:
      progressive:
        when: anytime
        perspective: several_fairly
        position: "Survey-based: nationally 87% of Democrats favor same-sex marriage and 81% say gay or lesbian relations are morally acceptable. Not broken out for this group."
        source: "gallup-lgbtq-2026, by party; pew-rls-nip, Same-sex marriage"
      moderate:
        position: "Survey-based: nationally 67% of independents favor same-sex marriage. This group is 45% moderate and 84% in favor overall, so the base settings fit."
        source: "gallup-lgbtq-2026, by party; pew-rls-nip, Political ideology"
      conservative:
        when: parent_led
        perspective: family_tradition
        position: "Survey-based: nationally 37% of Republicans favor same-sex marriage and 35% say gay or lesbian relations are morally acceptable. Not broken out for this group."
        source: "gallup-lgbtq-2026, by party"
        handoff: "Families come in lots of shapes. That's a good one to talk about with Mom or Dad."

  - point: 10
    when: parent_led
    from_age: null
    perspective: several_fairly
    position: >
      No official position; no survey found for this group alone. Among all religiously unaffiliated
      adults, 58% say a person's gender can differ from their sex at birth, and 58% call greater
      acceptance of transgender people a change for the better while 22% call it a change for the worse.
    source: "pew-trans-2022, religiously unaffiliated (58%); pew-rls-lgbtq, acceptance of transgender people"
    split: "Most unaffiliated lean accepting; a substantial minority disagree. Figures are for all 'nones', not this subgroup."
    handoff: "People have different ideas about that. It's a great one to talk about with Mom or Dad."
    parent_note: >
      The unaffiliated figures include atheists and agnostics, who lean more accepting than this
      group may. Pew says 8 in 10 unaffiliated Americans say religion has no influence on their
      views of gender. Parent-led is a cautious starting point; change it if your family is settled on this.
    needs_check: true
    by_lean:
      progressive:
        when: anytime
        perspective: several_fairly
        position: "Survey-based: nationally 60% of Democrats say changing one's gender is morally acceptable, and 35% favor banning gender-transition care for minors. Not broken out for this group."
        source: "gallup-lgbtq-2026, by party; pew-trans-2025, by party"
        handoff: "Some people feel they're a different gender than people thought when they were born. Mom or Dad can tell you more."
      moderate:
        position: "Survey-based: nationally 42% of independents say changing one's gender is morally acceptable. Base settings kept."
        source: "gallup-lgbtq-2026, by party"
      conservative:
        when: parent_led
        perspective: family_tradition
        position: "Survey-based: nationally 5% of Republicans say changing one's gender is morally acceptable, and 79% favor banning gender-transition care for minors. Not broken out for this group."
        source: "gallup-lgbtq-2026, by party; pew-trans-2025, by party"

  - point: 11
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). Families in this group take many shapes: 40% of adults are
      married, 18% live with a partner, 11% are divorced or separated, and 27% have never married.
      Among all unaffiliated, 47% say children with two parents do better when one stays home.
    source: "pew-rls-nip, Marital status; pew-rls-gender-parenting, one parent at home (47%)"
    split: none
    handoff: "Families look different in lots of homes. If you want to talk about it, Mom or Dad are great people to ask."
    parent_note: >
      Families in this group take many shapes, so a matter-of-fact answer
      fits: "Some kids live with both parents, some with one, some go between two homes. What makes a
      family is people who love and look after each other."
    needs_check: false

  - point: 12
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). About half believe in heaven (47%) and about a third in
      hell (35%); 79% believe people have a soul or spirit. In 2021, 62% said everything in life happens
      for a reason.
    source: "pew-rls-nip, Heaven / Hell; pew-rls-beliefs, souls (79%); pew-afterlife-2021, everything happens for a reason (62%)"
    split: "Roughly even between those who believe in heaven and those who do not."
    handoff: "People believe different things about what happens after we die. That's a good one to talk about with Mom or Dad."
    parent_note: >
      Your group is split about evenly on heaven, and most believe in a soul. Honest answers that fit
      many families here: "Nobody knows for sure. Some people believe Grandpa's spirit is in heaven.
      We remember him and the love stays with us."
    needs_check: false

  - point: 13
    when: parent_led
    from_age: null
    perspective: family_tradition
    position: >
      No official position; no survey found on how this group talks with children about a death in
      the family or a pet.
    source: "pew-afterlife-2021, no question on this topic"
    split: "Unknown."
    handoff: "It's not your fault. Feeling sad is okay. Let's tell Mom or Dad how you're feeling. They'd want to know."
    parent_note: >
      No survey covers this. Parent-led because a real death is personal; the tutor can still tell a
      child it is not their fault and that sad feelings are normal, then hand off. See point 12 for
      what families in this group commonly believe about an afterlife.
    needs_check: true

  - point: 14
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). This group leans Democratic but is mixed: 53% Democrat or
      lean Democrat, 39% Republican or lean Republican, 9% no lean. 45% call themselves moderate, 31%
      liberal, 19% conservative.
    source: "pew-rls-nip, Party affiliation / Political ideology"
    split: "Democratic-leaning majority and a large Republican-leaning minority; many moderates."
    handoff: "People in both parties want good things for the country; they disagree about how. Ask Mom or Dad what they think!"
    parent_note: >
      With a politically mixed group, the tutor explains how voting and government work and never
      says a party is good or bad. Pew finds large shares of each party now see the other as immoral
      (72% of Republicans about Democrats, 63% of Democrats about Republicans); the tutor won't echo that.
    needs_check: true
    by_lean:
      progressive:
        position: "No survey found for this group by lean. Base settings kept: the tutor explains how government works without ranking parties."
        source: "pew-rls-nip, Party affiliation; pew-partisan-hostility-2022"
      moderate:
        position: "No survey found for this group by lean. Base settings kept."
        source: "pew-rls-nip, Political ideology"
      conservative:
        position: "No survey found for this group by lean. Base settings kept: the tutor explains how government works without ranking parties."
        source: "pew-rls-nip, Party affiliation; pew-partisan-hostility-2022"

  - point: 15
    when: parent_led
    from_age: null
    perspective: several_fairly
    position: >
      No official position; no survey found on how this group handles current wars, elections or news
      with children. Nationally, parents' top worry for their kids is anxiety or depression (40%
      extremely or very worried).
    source: "pew-parenting-2023, parents' worries"
    split: "Unknown."
    handoff: "That's a big question, and it's a good one to talk about with Mom or Dad. They can help you understand it."
    parent_note: >
      No survey covers this for your group. Parent-led is a cautious default so news that might
      frighten a child reaches them through you. You can change it to let the tutor explain plain,
      calm facts (for example, how an election works) from an age you choose.
    needs_check: true
    by_lean:
      progressive:
        position: "No survey found for this group by lean. Base settings kept."
        source: "pew-parenting-2023"
      moderate:
        position: "No survey found for this group by lean. Base settings kept."
        source: "pew-parenting-2023"
      conservative:
        position: "No survey found for this group by lean. Base settings kept."
        source: "pew-parenting-2023"

  - point: 16
    when: anytime
    from_age: null
    perspective: several_fairly
    position: >
      No official position (survey-based). 57% of this group say the government should do more to
      help people in need, 22% about the right amount, 20% less.
    source: "pew-rls-nip, Government assistance; pew-rls-government, religiously unaffiliated (60%)"
    split: "Majority favoring more help; a substantial minority favoring the same or less."
    handoff: "People become homeless for lots of reasons, and people have different ideas about how to help. Ask Mom or Dad what they think."
    parent_note: >
      A balanced answer: "Some people lose a job, get sick, or don't have family to help. People
      disagree on how much is about hard choices and how much is about bad luck, and on who should
      help." The lean variants below use national party data.
    needs_check: true
    by_lean:
      progressive:
        perspective: several_fairly
        position: "Survey-based: nationally 71% of Democrats say people are poor mainly because of circumstances beyond their control; 19% say lack of effort. Not broken out for this group."
        source: "pew-rich-poor-2017, by party"
      moderate:
        position: "No survey found for moderates in this group. Base settings kept."
        source: "pew-rls-nip, Government assistance"
      conservative:
        perspective: several_fairly
        position: "Survey-based: nationally 56% of Republicans say people are poor mainly because of lack of effort; 32% say circumstances beyond their control. Not broken out for this group."
