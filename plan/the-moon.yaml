# The Moon: a theme, one week (week 5, Monday 23 to Sunday 29 November 2026), for grade bands 2-3 and 4-5.
# Picked by Brandon and June on 8 Nov 2026 from plan/candidates/themes.md (docs/theme-a-week-slice.md): a theme
# is one week, seven topics, one a day, in this file's order, on the slot each names, beside the week's 28 short
# lessons (decided 8 Nov 2026, docs/08). The Moon is full at 4:55 am on Tuesday 24 November, Hawaiʻi time.
#
# Format: lib/plan.ts. Import with npm run plan:import. Sequence 2: Egypt (sequence 1) holds weeks 1 to 4, so this
# holds week 5. Summaries are for the tutor, not the child: plain facts, the mechanism named, as exact as the
# source. No values point is touched; no age of the Moon or its craters is given (point 5).

