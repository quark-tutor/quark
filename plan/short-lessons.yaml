# Short lessons: one idea chain on one slot, not tied to a stretch or a week.
# Decided 16 Oct 2026 (docs/08): a week is a mix, one slot a day for the running thread and four
# for short lessons, taken in this file's order, the next unused lesson for each open slot.
# Drafted by Claude Code, picked by Brandon and June; the candidates and why each picture was
# picked are in plan/candidates/short-lessons.md.
#
# Format: lib/plan.ts (ShortLesson). Import with npm run plan:import. Summaries are for the tutor,
# not the child: plain facts, the mechanism named. Every lesson says which values points it
# touches (packs/README.md), [] for none; the gate reads them (step 5). Keys are never reused.

